name: Quiet Premium v1.10.1 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qp-v1101.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.10.1 homepage patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          txt = p.read_text(encoding='utf-8')
          txt = txt.replace('build v1.10.0', 'build v1.10.1')
          txt = txt.replace('PHASE 3 — APPROVED HOMEPAGE BODY MODERNIZATION', 'PHASE 3.1 — MOBILE LENGTH & REPETITION REDUCTION')
          txt = txt.replace('Approved Phase 1–2 hero preserved. Homepage body simplified around outcomes, routing, lifestyle proof, process, and closing CTA.', 'Approved Phase 1–3 visual direction preserved. Mobile routing compressed, process section removed, and repeated result copy eliminated.')
          start = txt.find('<section class="process">')
          if start >= 0:
              end = txt.find('<section class="final-cta">', start)
              if end < 0: raise RuntimeError('Could not locate final CTA')
              txt = txt[:start] + txt[end:]
          txt = txt.replace('        <div class="mini-rule"></div>\n        <div class="same">Same spend.<br/>Different outcome.</div>\n', '')
          mobile = '\n      <div class="routing-mobile" aria-label="Quiet Premium routing summary">\n        <div class="routing-mobile-pill">Your spend</div>\n        <div class="routing-mobile-arrow">↓</div>\n        <div class="routing-mobile-hub">QP</div>\n        <div class="routing-mobile-arrow">↓</div>\n        <div class="routing-mobile-pill light">Smarter structure</div>\n        <div class="routing-mobile-arrow">↓</div>\n        <div class="routing-mobile-result">Better travel outcomes</div>\n      </div>\n'
          needle = '    <div class="routing-visual" aria-label="Illustration of spend being routed into better travel outcomes">'
          if 'class="routing-mobile"' not in txt:
              if needle not in txt: raise RuntimeError('Could not locate desktop routing visual')
              txt = txt.replace(needle, mobile + '\n' + needle)
          css = '/* PHASE 3.1 — compact mobile journey */\n.routing-mobile{display:none}\n@media(max-width:600px){.opportunity{padding-top:58px;padding-bottom:58px}.opportunity-grid{gap:28px}.opportunity-copy p{margin-top:16px}.opportunity-copy .btn{margin-top:22px}.routing-visual{display:none}.routing-mobile{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px;padding:24px 0 0}.routing-mobile-pill{width:100%;min-height:58px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#343330;color:#F3EFE7;font:600 12px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase}.routing-mobile-pill.light{background:#DDD6CB;color:#25231F}.routing-mobile-hub{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#11110F;color:var(--gold);border:1px solid rgba(182,154,104,.5);font:400 22px/1 var(--serif)}.routing-mobile-arrow{font:400 18px/1 var(--sans);color:#9B7948}.routing-mobile-result{width:100%;padding:15px 18px;border-top:1px solid rgba(0,0,0,.14);color:#28251F;text-align:center;font:400 22px/1.2 var(--serif)}.lifestyle-proof{min-height:450px;padding-top:56px;padding-bottom:56px}.lifestyle-head .h2{font-size:44px}.lifestyle-copy{font-size:14px;line-height:1.68}.final-cta{min-height:385px;padding-top:58px;padding-bottom:58px}}\n'
          if 'PHASE 3.1 — compact mobile journey' not in txt:
              txt = txt.replace('</style>', css + '</style>')
          txt = txt.replace("build:'1.10.0'", "build:'1.10.1'")
          assert 'build v1.10.1' in txt
          assert '<section class="process">' not in txt
          assert 'class="routing-mobile"' in txt
          assert 'class="final-cta"' in txt
          p.write_text(txt, encoding='utf-8')
      - name: Commit homepage update
        run: |
          git config user.name "Quiet Premium Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Quiet Premium v1.10.1 — shorten mobile homepage"
          git push
