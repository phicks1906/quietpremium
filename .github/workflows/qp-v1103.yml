name: Quiet Premium homepage v1.10.3 refinements

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qp-v1103.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved homepage refinements
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          txt = p.read_text(encoding='utf-8')

          txt = txt.replace('build v1.10.2', 'build v1.10.3')
          txt = txt.replace('PHASE 3.2 — HOW-IT-WORKS FLOW CORRECTION', 'PHASE 3.3 — HOMEPAGE CLARITY & MOBILE REFINEMENT')
          txt = txt.replace('Approved visual direction preserved. How-it-works loop removed: hero and sample proof now go directly to Architecture; repeated ivory CTA removed.', 'Approved visual direction preserved. Hero secondary path restored visibly, outcomes and mobile routing made more concrete, and lifestyle section tightened.')

          # Keep the secondary path explicit and make it visually distinct on phones.
          txt = txt.replace('<a href="architecture.html" class="btn ghost">See How It Works</a>', '<a href="architecture.html" class="btn ghost hero-how">See How It Works</a>')

          # Make the outcome concrete rather than abstract.
          txt = txt.replace('<strong>More value</strong><p>More from the points<br>you already earn.</p>', '<strong>More travel</strong><p>More trips.<br>Less cash required.</p>')

          # Make the mobile routing mechanism self-explanatory.
          txt = txt.replace('<div class="routing-mobile-pill light">Smarter structure</div>', '<div class="routing-mobile-pill light">Right cards + airline + hotel</div>')

          # Tighten the lifestyle explanation.
          old_life = 'When your spend is routed correctly, you do not just earn more points. You create more redemption capacity, reach useful status sooner when it makes sense, receive better treatment more often, and create more optionality — from the seats you choose to the places you stay.'
          new_life = 'Correct routing creates more redemption capacity, useful status sooner when it makes sense, and better treatment more often — without increasing your spending.'
          txt = txt.replace(old_life, new_life)

          # Append narrowly scoped mobile refinements after existing Phase 3.1 CSS.
          marker = '</style></head><body>'
          css = '''\n/* PHASE 3.3 — homepage clarity + mobile refinement */\n@media(max-width:600px){\n  .actions .hero-how{display:inline-flex!important;background:rgba(11,11,10,.52)!important;color:var(--gold)!important;border-color:rgba(207,180,125,.62)!important;}\n  .routing-mobile-pill.light{padding:0 14px;text-align:center;line-height:1.35;}\n  .lifestyle{min-height:390px!important;padding-top:48px!important;padding-bottom:48px!important;}\n  .life-copy{font-size:13.5px!important;line-height:1.62!important;}\n}\n'''
          txt = txt.replace(marker, css + marker)
          txt = txt.replace("build:'1.10.2'", "build:'1.10.3'")

          assert 'class="btn ghost hero-how">See How It Works</a>' in txt
          assert '<strong>More travel</strong>' in txt
          assert 'Right cards + airline + hotel' in txt
          assert 'Correct routing creates more redemption capacity' in txt
          assert '.lifestyle{min-height:390px!important' in txt
          assert 'build v1.10.3' in txt
          p.write_text(txt, encoding='utf-8')

      - name: Commit homepage refinements
        run: |
          git config user.name "Quiet Premium Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Quiet Premium v1.10.3 — refine homepage clarity and mobile flow"
          git push
