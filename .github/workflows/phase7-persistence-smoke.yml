name: Phase 7 Persistence Production Smoke

on:
  push:
    branches:
      - phase7-persistence-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Build persist and retrieve golden plan
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(sed -n 's/^const PUBLIC_BROWSER_KEY="\([^"]*\)".*/\1/p' supabase/functions/qp-build-plan/index.ts)"
          test -n "$KEY"
          cat > /tmp/golden.json <<'JSON'
          {"profile":{"asOfDate":"2026-09-24","spend":{"dining":20000,"grocery":15000,"online_grocery":0,"drugstore":0,"gas_ev":5000,"transit":0,"online_retail":5000,"vacation_home":0,"airfare":12000,"hotel":10000,"general":83000},"currentCards":["amex_platinum","amex_gold","delta_reserve"],"currentRouting":{"dining":[{"card":"amex_gold","amount":20000}],"grocery":[{"card":"amex_gold","amount":15000}],"online_grocery":[],"drugstore":[],"gas_ev":[{"card":"delta_reserve","amount":5000}],"transit":[],"online_retail":[{"card":"amex_platinum","amount":5000}],"vacation_home":[],"airfare":[{"card":"delta_reserve","amount":12000}],"hotel":[{"card":"amex_platinum","amount":10000}],"general":[{"card":"delta_reserve","amount":83000}]},"remainingYear":{"cardSpend":{"dining":8000,"grocery":6000,"gas_ev":2000,"online_retail":2000,"airfare":5000,"hotel":4000,"general":36000},"delta":{"mqd":1500},"hotel":{"qualifyingNights":3}},"home_airport":"SDF","frequent_destinations":["ATL","JFK","LAS"],"primaryAirline":"delta","primaryAirlineShare":0.75,"annualOneWayFlights":16,"currentAirlineStatus":"Gold Medallion","statusProgress":{"delta":{"mqd":5500},"hotel":{"qualifyingNights":8}},"primaryHotel":"marriott","primaryHotelShare":0.35,"currentHotelStatus":"Gold Elite","premiumStayShare":0.5,"currencyUtility":{"amex_mr":1,"chase_ur":0.75,"capital_one_miles":0.95,"hyatt_points":1},"cardUniqueBenefitValue":{"amex_platinum":700,"amex_gold":250,"delta_reserve":550},"legacyNaturalBenefitValue":{},"bookingMethod":{"airfare":"direct_airline","hotel":"direct_hotel"},"aspirations":["travel more","better flights","better hotels"]},"funnelSession":"phase7persist123456","persistPlan":true}
          JSON
          BUILD_URL="https://jdtbyudbwmwldrkjaznk.supabase.co/functions/v1/qp-build-plan"
          code="$(curl -sS --max-time 50 -o /tmp/build.json -w '%{http_code}' -H 'Content-Type: application/json' -H "apikey: $KEY" --data-binary @/tmp/golden.json "$BUILD_URL")"
          echo "BUILD HTTP $code"
          jq '{status,engineVersion,factReady:.factQuality.productionReady,auditPass:.audit.pass,recommendedId:.recommended.id,exact:.integrity.distributedExactPortfolioSearch,reconstruction:.integrity.distributedSelectionReconstruction,resultReady:.resultExperience.quality.ready,savedId:.savedPlan.architecture_id,hasToken:(.savedPlan.retrieval_token|type=="string" and length>40)}' /tmp/build.json
          test "$code" = "200"
          jq -e '.status=="ready" and .engineVersion=="5.0-alpha.46" and .factQuality.productionReady==true and .audit.pass==true and .integrity.distributedExactPortfolioSearch==true and .integrity.distributedSelectionReconstruction==true and .resultExperience.quality.ready==true and (.savedPlan.architecture_id|type=="string" and length>10) and (.savedPlan.retrieval_token|type=="string" and length>40)' /tmp/build.json >/dev/null
          ARCH="$(jq -r '.savedPlan.architecture_id' /tmp/build.json)"
          TOKEN="$(jq -r '.savedPlan.retrieval_token' /tmp/build.json)"
          jq -n --arg a "$ARCH" --arg t "$TOKEN" '{p_architecture_id:$a,p_token:$t}' >/tmp/get.json
          GET_URL="https://jdtbyudbwmwldrkjaznk.supabase.co/rest/v1/rpc/qp_get_plan_v1"
          getcode="$(curl -sS --max-time 15 -o /tmp/retrieved.json -w '%{http_code}' -H 'Content-Type: application/json' -H "apikey: $KEY" --data-binary @/tmp/get.json "$GET_URL")"
          echo "GET HTTP $getcode"
          jq '{schema,id,engineVersion,resultStatus:.result.status,recommendedId:.result.recommended.id,resultReady:.result.resultExperience.quality.ready}' /tmp/retrieved.json
          test "$getcode" = "200"
          jq -e --slurpfile b /tmp/build.json '.schema=="qp-plan-server-v1" and .result.status=="ready" and .result.engineVersion=="5.0-alpha.46" and .result.resultExperience.quality.ready==true and .result.recommended.id==$b[0].recommended.id and .result.resultExperience==$b[0].resultExperience' /tmp/retrieved.json >/dev/null
