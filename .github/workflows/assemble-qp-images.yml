name: Assemble Quiet Premium production photography

on:
  push:
    paths:
      - '.image-build/READY-v210'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate binary images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .image-build/avif-hero/*.part | base64 --decode > assets/qp-hero-v210.avif
          cat .image-build/avif-outcome/*.part | base64 --decode > assets/qp-outcome-v210.avif
          cat .image-build/avif-closing/*.part | base64 --decode > assets/qp-closing-v210.avif

          echo '9d825cc1845bd45a67df524d994a3e0e2e3c892f4673f9edf6f0c171eb7e6fc4  assets/qp-hero-v210.avif' | sha256sum -c -
          echo 'd0d394b797d5c09d75dc060d6f4771d941de85a94d7f4194204021fde3bf9934  assets/qp-outcome-v210.avif' | sha256sum -c -
          echo 'd49ab5976ce4ca400eaae0476bfa7ece716a09ea8c0b1e1ee2dd9c1157038f3d  assets/qp-closing-v210.avif' | sha256sum -c -

          file assets/qp-hero-v210.avif assets/qp-outcome-v210.avif assets/qp-closing-v210.avif

      - name: Wire production CSS and build metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > assets/v210-photo-fix.css <<'CSS'
          /* Quiet Premium v2.0.10 — complete verified binary photography */
          #hero .photo{
            background-image:url('qp-hero-v210.avif') !important;
            background-position:center 53% !important;
            background-size:cover !important;
            background-repeat:no-repeat !important;
          }
          .outphoto{
            background-image:url('qp-outcome-v210.avif') !important;
            background-position:center 58% !important;
            background-size:cover !important;
            background-repeat:no-repeat !important;
          }
          .closing{
            background-image:url('qp-closing-v210.avif') !important;
            background-position:center 53% !important;
            background-size:cover !important;
            background-repeat:no-repeat !important;
          }
          @media(max-width:820px){
            .closing{
              background-image:url('qp-closing-v210.avif') !important;
              background-position:center 53% !important;
              background-size:cover !important;
              background-repeat:no-repeat !important;
              color:#fff !important;
            }
            .closing:before{
              display:block !important;
              background:linear-gradient(90deg,rgba(16,16,15,.74),rgba(16,16,15,.48),rgba(16,16,15,.28)) !important;
            }
            .closing .trust{color:rgba(255,255,255,.82) !important;}
          }
          CSS

          cp assets/v208-app.js assets/v210-app.js
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/v210-app.js')
          s=p.read_text()
          s=s.replace("build:'2.0.8'", "build:'2.0.10'")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/v209-photo-fix.css', 'assets/v210-photo-fix.css?v=210')
          s=s.replace('assets/v208-app.js', 'assets/v210-app.js?v=210')
          s=s.replace('Build v2.0.9', 'Build v2.0.10')
          p.write_text(s)
          PY

      - name: Commit atomic production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'quietpremium-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .image-build
          git rm .github/workflows/assemble-qp-images.yml
          git add index.html assets/qp-hero-v210.avif assets/qp-outcome-v210.avif assets/qp-closing-v210.avif assets/v210-photo-fix.css assets/v210-app.js
          git commit -m 'Quiet Premium v2.0.10 — install verified binary photography'
          git push origin HEAD:main
