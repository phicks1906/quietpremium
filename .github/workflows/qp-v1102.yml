name: Quiet Premium v1.10.2 flow correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qp-v1102.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated How It Works loop
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          txt = p.read_text(encoding='utf-8')
          txt = txt.replace('build v1.10.1', 'build v1.10.2')
          txt = txt.replace('PHASE 3.1 — MOBILE LENGTH & REPETITION REDUCTION', 'PHASE 3.2 — HOW-IT-WORKS FLOW CORRECTION')
          txt = txt.replace('Approved Phase 1–3 visual direction preserved. Mobile routing compressed, process section removed, and repeated result copy eliminated.', 'Approved visual direction preserved. How-it-works loop removed: hero and sample proof now go directly to Architecture; repeated ivory CTA removed.')
          txt = txt.replace('href="#opportunity" class="btn ghost">See How It Works</a>', 'href="architecture.html" class="btn ghost">See How It Works</a>')
          txt = txt.replace('<a href="#opportunity">See how it works →</a>', '<a href="architecture.html">See how it works →</a>')
          txt = txt.replace('<a href="architecture.html" class="btn">See How It Works</a>', '')
          txt = txt.replace("build:'1.10.1'", "build:'1.10.2'")
          assert 'build v1.10.2' in txt
          assert 'href="architecture.html" class="btn ghost">See How It Works</a>' in txt
          assert '<a href="architecture.html">See how it works →</a>' in txt
          assert '<a href="architecture.html" class="btn">See How It Works</a>' not in txt
          p.write_text(txt, encoding='utf-8')
      - name: Commit homepage flow correction
        run: |
          git config user.name "Quiet Premium Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Quiet Premium v1.10.2 — fix How It Works flow"
          git push
